# Continuous integration for the InterstellaQ web app.
#
# Adapted from the Stellar Scaffold template workflow that lived, inactive,
# in app/.github/workflows/build.yml (GitHub only runs workflows from the
# repository-root .github/). Kept: install, lint and format checks. Dropped,
# because they target the template rather than this app: the template
# dependency-parity guard (needs a templates/ directory), the Scaffold CLI and
# local Docker network for contract client generation (the MVP calls no
# Soroban contract, see docs/adr/0002-invoice-correlation.md), and the
# Guess the Number Playwright suites (they assert template UI this app
# replaced). The live Testnet suites stay on demand (npm run test:net).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, format, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # npm workspace root: app/package.json and app/package-lock.json.
        working-directory: app
    env:
      # Git hooks are a local convenience; skip installing them in CI.
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      # ESLint 10 and Vite 8 need Node >= 22.13; "22" resolves to latest 22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fast checks first, so trivial failures report in seconds.
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck --workspace app

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
